<svg xmlns="http://www.w3.org/2000/svg" width="820" height="262" viewBox="0 0 820 262" role="img" aria-label="Fixed payload of every request (system prompt + tool schemas)">
<title>Fixed payload of every request (system prompt + tool schemas)</title><desc>measured with the gateway&#x27;s count_tokens · the unchanged prefix is served from the cache</desc>
